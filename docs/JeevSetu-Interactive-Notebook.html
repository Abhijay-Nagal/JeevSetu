pre: [
 {type:"call", variant:"tip", title:"Beat 4 is unusually strong here", html:"<p>You are offering a <b>failure story with a good ending</b>, which is the single most credible kind. Interviewers almost always take it, and you have the whole debugging sequence — bundle size, then DNS, then removal — ready with commits behind it.</p>"}
],
questions: [

{group:"Opening", tag:"must",
 q:"Tell me about JeevSetu.",
 a:"<p>Four beats, ~60 seconds. Start with the client's problem, and say “we” for the system, “I” for your parts.</p>",
 say:"“It was built for BNHS — one of India's oldest conservation organisations — at Code for Good. Their problem wasn't a lack of content, it was that decades of it sat scattered across a magazine, a journal, a virtual museum and newsletters with no single entry point. So we built a hub that organises what already exists: RAG-based search and a chatbot grounded in their real archive with cited sources, a community layer, and gamification pointing at real BNHS actions. I owned the RAG pipeline and the reward system.”",
 follow:["What is RAG?","What did you personally build?","How big was the team?"]},

{group:"RAG", tag:"must",
 q:"Explain RAG.",
 a:"<p>Problem first, then mechanism, then why not the alternatives.</p><p><b>Problem:</b> an LLM only knows its training data. Ask about BNHS's 2019 Hornbill issue and it either says it doesn't know or confidently invents something — and for a scientific organisation a fabricated species record is reputational damage.</p><p><b>Mechanism:</b> retrieve relevant documents at query time, put them in the prompt, and have the model answer <em>from that context</em> with a citation.</p><p><b>Versus fine-tuning:</b> fine-tuning teaches <b>style and format</b>, not reliable factual recall. It can't cite sources, and every content update means retraining. RAG updates instantly and every answer is traceable.</p><p><b>Versus long context:</b> 3,197 records don't fit in any window, and you'd pay for every token on every query.</p>",
 say:"“The model only knows its training data, so asking about BNHS's own archive gets you either 'I don't know' or a confident fabrication — which for a conservation NGO is reputational damage. RAG retrieves the relevant documents at query time and puts them in the prompt, so the answer comes from real content and can cite it. People reach for fine-tuning here, but fine-tuning teaches a model how to speak, not what to know — it can't cite sources and every content update means retraining.”",
 follow:["How do you chunk documents?","What if retrieval finds nothing?","How do you stop hallucination?"]},

{group:"RAG", tag:"likely",
 q:"How do you prevent hallucination?",
 a:"<p>Four mechanisms, and honesty about what remains.</p><ul><li><b>Ground in retrieved context</b> and instruct the model to answer from it — the base defence.</li><li><b>Citations as a required schema field.</b> <code>source_reference</code> is part of the JSON shape, so attribution isn't optional.</li><li><b>Explicit fallback instruction.</b> When retrieval finds nothing, the prompt says to use general knowledge <em>and leave the citation null</em> — so ungrounded answers are visibly ungrounded.</li><li><b>Delimited context.</b> Retrieved text is wrapped in <code>&lt;CONTEXT&gt;</code> tags, separating untrusted data from instructions — the structural defence against prompt injection.</li></ul><p><b>Be honest:</b> “none of this eliminates hallucination. The model can still misread the context. What would actually catch that is a grounding check — verifying the cited source supports the claim, either by overlap scoring or an LLM-as-judge pass — and that isn't built.”</p>",
 say:"“Four things. Ground the answer in retrieved context; make the citation a required field in the JSON schema so attribution isn't optional; when retrieval finds nothing, explicitly tell the model to fall back to general knowledge and leave the citation null so ungrounded answers are visible; and delimit the retrieved text in context tags so untrusted content can't be read as instructions. None of that eliminates hallucination though — what would actually catch it is a grounding check verifying the cited source supports the claim, and we didn't build that.”",
 follow:["What is prompt injection?","What is LLM-as-judge?","How would you measure hallucination rate?"]},

{group:"The migration — your best story", tag:"must",
 q:"Tell me about a technical problem you had to solve.",
 a:"<p>This is the answer. Five beats: <b>what we built → what broke → what we tried → the call → the trade.</b></p><ol><li><b>Built:</b> proper semantic search — local <code>sentence-transformers</code> (<code>all-mpnet-base-v2</code>, 768 dims), embeddings in a pgvector column, cosine similarity via a <code>match_documents</code> Postgres function.</li><li><b>Broke:</b> <code>sentence-transformers</code> pulls in PyTorch and the deployment bundle exceeded the serverless size limit.</li><li><b>Tried:</b> moved embeddings to the Hugging Face inference API — which then failed with DNS issues from AWS Mumbai. Tried two different endpoints.</li><li><b>The call:</b> a slightly worse search that deploys reliably beats a better search that doesn't run. Moved retrieval to Postgres full-text search — <code>to_tsvector</code>, <code>plainto_tsquery</code>, GIN index.</li><li><b>The trade:</b> lost semantic matching, which is a real loss. Gained deployability, zero per-query cost and one fewer failure mode. The pgvector function is still in the migrations, so it's reversible.</li></ol>",
 say:"“We built proper semantic search first — local sentence-transformers, 768-dimensional embeddings, cosine similarity over pgvector. It worked locally and was clearly better. Then it wouldn't deploy: PyTorch blew the serverless bundle limit. So we moved embeddings to the Hugging Face API, and that failed from AWS Mumbai with DNS issues — we tried two endpoints. At that point I made the call that a slightly worse search that deploys beats a better one that doesn't run, and we moved to Postgres full-text search. We lost semantic matching, which is genuinely worse, but we got something that works everywhere with no external dependency. The pgvector function is still in the migrations so it's reversible.”",
 follow:["What exactly did you lose?","How would you get semantic search back?","What is full-text search doing?"]},

{group:"The migration — your best story", tag:"likely",
 q:"How would you get semantic search back?",
 a:"<p>Four options, with the best one first.</p><ol><li><b>Hybrid search.</b> Run full-text and vector search in parallel and fuse the rankings — <b>Reciprocal Rank Fusion</b> is the standard method. This is genuinely better than either alone: keyword search wins on Latin binomials and exact species names, vector search wins on conceptual queries. That's the right end state, not just a restoration.</li><li><b>A managed vector database</b> — Pinecone, Weaviate or Qdrant — removing both the bundle-size and self-hosting problems.</li><li><b>Embeddings from an API that works from our region</b> — OpenAI or Cohere, sidestepping the specific DNS issue that killed the Hugging Face route.</li><li><b>Precompute at ingest.</b> Document embeddings are already generated offline; only the <em>query</em> embedding is needed live, which is a much smaller dependency to satisfy.</li></ol>",
 say:"“Hybrid search, ideally — run both and fuse the rankings with something like Reciprocal Rank Fusion. That's actually better than pure vector search, because keyword matching wins on Latin species names where embeddings are weakest, and vector wins on conceptual queries. The practical unblock is either a managed vector database or an embedding API that works from our deployment region. And worth noting only the query embedding is needed at request time — document embeddings are already offline.”",
 follow:["What is Reciprocal Rank Fusion?","Why are embeddings weak on rare names?"]},

{group:"Backend", tag:"must",
 q:"Why FastAPI and Python rather than Node?",
 a:"<p>Ecosystem fit, named concretely.</p><p>“The hard parts of this project are data problems and those libraries are Python-only: <code>sentence-transformers</code> for embeddings, <code>pypdf</code> for newsletter extraction, <code>XGBoost</code> and <code>SHAP</code> for the analytics. There's no comparable Node equivalent for any of them.”</p><p>Then the FastAPI-specific wins: <b>async I/O</b> (the workload is I/O-bound — waiting on Supabase and Groq), <b>Pydantic validation</b> for free from type hints, and <b>auto-generated OpenAPI docs</b>, which mattered a lot with a frontend team building against the API in parallel.</p><p>Show range: “for a CRUD-only backend with no data work I'd be equally happy in Node — the argument here is specifically the ecosystem.”</p>",
 say:"“The hard parts are data problems and those libraries only exist in Python — sentence-transformers, pypdf, XGBoost, SHAP. FastAPI then gives async I/O, which matters because the workload is mostly waiting on Supabase and Groq, Pydantic validation from type hints, and auto-generated OpenAPI docs, which was genuinely useful with a frontend team building against the API in parallel. For a pure CRUD backend I'd be just as happy in Node — the argument here is the ecosystem.”",
 follow:["What does async actually buy you here?","How does Pydantic validation work?"]},

{group:"Backend", tag:"likely",
 q:"How does authentication work in the backend?",
 a:"<p><b>Flow:</b> the frontend authenticates with Supabase and gets a JWT. Every backend request sends it as a bearer token. <code>get_current_user</code> is a FastAPI dependency that <b>verifies</b> the token against Supabase Auth — not merely decodes it — and then loads the user's profile row for their role.</p><p><b>Roles:</b> <code>require_role(\"admin\")</code> is a dependency <em>factory</em> that returns a dependency closed over the allowed roles, so one implementation covers every combination. FastAPI resolves the chain automatically: verify → load profile → check role.</p><p><b>Two details worth volunteering:</b> a missing profile row defaults to the <em>least</em> privileged role, because a data inconsistency must never escalate access. And 401 versus 403 is used correctly — 401 means “I don't know who you are”, 403 means “I know, and you may not do this.”</p>",
 say:"“The frontend authenticates with Supabase and gets a JWT, which every backend request sends as a bearer token. A FastAPI dependency verifies it against Supabase Auth — verifying, not just decoding, because decoding only tells you what the token claims — then loads the profile for the role. require_role is a dependency factory, so one implementation covers every role combination and FastAPI resolves verify-then-load-then-check automatically. A missing profile row defaults to the least-privileged role, because a data inconsistency should never escalate access.”",
 follow:["Difference between 401 and 403?","What if Supabase is down?","How do you test this?"]},

{group:"Debugging", tag:"likely",
 q:"Tell me about a bug that was hard to find.",
 a:"<p>The CORS-masking-a-500 bug. It's a great story because the symptom actively misdirects you.</p><p><b>Symptom:</b> the frontend reports a CORS error. <b>Actual cause:</b> an unhandled exception in a service function.</p><p><b>Why it misleads:</b> Starlette's <code>ServerErrorMiddleware</code> sits <em>outside</em> <code>CORSMiddleware</code>. An unhandled exception propagates past the CORS layer, so the 500 response carries <b>no CORS headers</b>. The browser blocks it and reports a CORS failure — hiding the real error message entirely. You end up debugging CORS config while the actual bug is a null reference.</p><p><b>How I found it:</b> called the endpoint with <code>curl</code>, which ignores CORS entirely, and immediately saw the real 500 and its traceback.</p><p><b>The fix:</b> a catch-all exception handler that returns a proper 500 <em>with</em> CORS headers, so the browser surfaces the real error from then on.</p>",
 say:"“The frontend was reporting a CORS error but the CORS config was correct. It turned out an unhandled 500 in a service was the cause — Starlette's error middleware sits outside the CORS middleware, so an unhandled exception produces a response with no CORS headers, and the browser blocks it and blames CORS, hiding the real error. I found it by hitting the endpoint with curl, which ignores CORS and showed the actual traceback. The fix was a catch-all handler that returns 500s with CORS headers attached, so the real error surfaces from then on.”",
 follow:["Why does curl bypass CORS?","What is middleware ordering?","How would you prevent this class of bug?"]},

{group:"Systems design", tag:"must",
 q:"Why is <code>award_coins</code> a database function?",
 a:"<p><b>Atomicity.</b> Awarding coins is two writes — insert a ledger row, increment the balance — that must agree. Done as two client calls, they're two separate HTTP requests; if the second fails the ledger says +10 and the balance disagrees, permanently.</p><p>A Postgres function runs both in <b>one transaction</b>: both commit or neither does. And <code>supabase-py</code> can't span a transaction across two requests, so pushing it into the database was the only clean option.</p><p>Second detail worth adding: the update is <code>coin_balance = coin_balance + p_amount</code>, not read-then-write. That makes it atomic against concurrency too — read-modify-write in application code is a classic <b>lost update</b>, where two concurrent awards both read 100, both write 110, and one vanishes.</p><p>And the design is balance + ledger deliberately: the ledger is the source of truth and the balance is a cached aggregate that can always be recomputed.</p>",
 say:"“Atomicity. It's two writes — the ledger row and the balance — and they have to agree. As two client calls they're two HTTP requests, so if the second fails the data is permanently inconsistent, and supabase-py can't span a transaction across requests. In a Postgres function both run in one transaction. The increment is also done in SQL rather than read-modify-write, which protects against lost updates when two awards land concurrently.”",
 follow:["What is a lost update?","What are the ACID properties?","When would you not use a DB function?"]},

{group:"Systems design", tag:"likely",
 q:"How do streaks work, and why no cron job?",
 a:"<p><b>Mechanism:</b> store <code>last_answered_date</code>. When the user answers, compute the gap. Gap of 1 extends the streak; gap greater than 1 spends a <b>freeze</b> if one is banked, otherwise resets to 1. Freezes are earned every 7 consecutive days, capped at 3.</p><p><b>Why lazy rather than cron:</b> the naive design scans every user nightly to find who missed yesterday. That means a scheduler to host and monitor, a job that must never fail silently, timezone handling for “what counts as yesterday”, and a scan that grows with <em>total</em> users rather than active ones.</p><p>Lazy evaluation computes the gap <b>when the user next answers</b> — exactly when it matters. No infrastructure, no scan, no silent failure, and inactive users cost nothing.</p><p><b>The principle:</b> compute state on read rather than on a schedule, whenever the result is only needed at read time.</p>",
 say:"“I store the last answered date and compute the gap when the user next answers. Gap of one extends the streak, a bigger gap spends a banked freeze or resets. No cron job, because a nightly scan means a scheduler to host, timezone edge cases at the reset boundary, a job that can fail silently and corrupt everyone's streak, and a scan that grows with total users rather than active ones. Computing it lazily means it's evaluated exactly when it matters, and inactive users cost nothing.”",
 follow:["What about timezones?","What if a user has two devices?","Where else does this pattern apply?"]},

{group:"Machine learning", tag:"likely",
 q:"Explain the churn model.",
 a:"<p><b>What it is:</b> an XGBoost binary classifier over 14 behavioural features — posts, likes given and received, coin totals and 7-day velocity, streaks, freezes used, communities, quiz attempts, days since last activity, account age. All derived from data the app already stores; <b>no new collection</b>, which matters for an NGO.</p><p><b>Why XGBoost:</b> small tabular data is exactly where gradient-boosted trees dominate — mixed scales without normalisation, automatic non-linear interactions, trains in seconds, and pairs with SHAP's fast TreeExplainer. A neural network would overfit immediately.</p><p><b>SHAP:</b> attributes each individual prediction across features, so the output is “flagged because 12 days inactive and streak collapsed” rather than just a number. <b>Local</b> explanation, not global importance — that's what makes it actionable.</p><p><b>Then the limitations, volunteered:</b> the churn label is a proxy (7 days inactive is a definition, not an observation); the classes are imbalanced so accuracy is misleading and you want precision and recall; retraining per request doesn't scale past hackathon size; and SHAP attributions are correlational, not causal.</p>",
 say:"“XGBoost binary classifier over fourteen behavioural features, all derived from data we already store — no new tracking, which matters for an NGO. Boosted trees because small tabular data is exactly their regime; a neural net would overfit immediately. SHAP gives per-user attributions so the output is 'flagged because twelve days inactive and the streak collapsed' rather than a bare score. I'd flag the limits though: the churn label is a proxy, the classes are imbalanced so accuracy would mislead, and the attributions are correlational — I wouldn't treat 'boost streaks' as a proven intervention without an experiment.”",
 follow:["Why not accuracy as a metric?","What is class imbalance?","How would you validate the intervention?"]},

{group:"Teamwork", tag:"must",
 q:"What did you personally build?",
 a:"<p>Be specific, and technical detail is what proves ownership.</p><p>“I owned the <b>RAG pipeline</b> — the retrieval layer, the grounded quiz and next-steps generation, and the migration from pgvector embeddings to Postgres full-text search when deployment constraints forced it. And the <b>reward system</b> — the coin ledger with the atomic <code>award_coins</code> function, the lazily-evaluated streak logic with earned freezes, and the daily question with its deterministic topic rotation.”</p><p>Then draw the boundary cleanly: “the community frontend was mostly a teammate's work — I built the endpoints behind it and integrated, but I wouldn't claim those components.”</p><p>The clean boundary is what makes the claims credible.</p>",
 say:"“I owned the RAG pipeline — retrieval, the grounded quiz and next-steps generation, and the migration off embeddings to full-text search when we couldn't deploy. And the reward system: the coin ledger with the atomic award function, the lazily-evaluated streaks with freezes, and the daily question. The community frontend was mostly a teammate's — I built the endpoints behind it and integrated, but I wouldn't claim those components.”",
 follow:["How did you divide work?","Any disagreements?","What would you do differently as a team?"]},

{group:"Teamwork", tag:"likely",
 q:"How did the team coordinate, and what went wrong?",
 a:"<p>Be concrete about mechanisms and honest about friction.</p><p><b>What worked:</b> the layered structure meant services were independently ownable — one person could work on rewards while another worked on community, touching almost no shared files. <b>FastAPI's auto-generated OpenAPI docs</b> were the real coordination win: the frontend could see every endpoint, its shape and its auth requirement without asking. Migrations were versioned SQL, so schema changes were reviewable and ordered. Branch-per-feature — the repo still has <code>CommunityEngagement</code>, <code>admin_analytics_frontend</code>, <code>mobile-ui</code> and others.</p><p><b>What was hard:</b> deployment was the bottleneck, not development. Most of the painful commits are environment problems — bundle size, DNS, CORS, Vercel routing prefixes — not feature work. <b>The lesson: deploy on day one, not at the end.</b> We found infrastructure constraints far too late, and that's what forced the search migration under time pressure.</p>",
 say:"“The layered structure meant services were independently ownable, so people weren't colliding in the same files, and FastAPI's auto-generated docs meant the frontend could see every endpoint and its auth requirement without asking. What went wrong is that deployment was the bottleneck, not development — most of our painful commits are environment problems: bundle size, DNS, CORS, routing prefixes. The lesson is deploy on day one. We found the infrastructure constraints far too late, and that's exactly why the search migration happened under time pressure instead of as a considered choice.”",
 follow:["How would you deploy earlier?","What is CI/CD?","Who made the final calls?"]},

 q:"What would you do differently?",
 a:"<p>Three, ranked:</p><ol><li><b>Deploy on day one.</b> Every serious problem we had was environmental — bundle size, DNS, CORS, routing. A deployment on day one would have surfaced the embedding constraint while we still had time to choose a managed vector DB rather than being forced into full-text search at the end.</li><li><b>Hybrid search from the start.</b> Even with working vector search, fusing it with keyword search is better — keyword matching is stronger on Latin binomials and rare species names, which is a <em>lot</em> of BNHS queries. We treated it as vector-or-keyword when it should have been both.</li><li><b>Define the churn label with the client.</b> Seven days of inactivity is my definition, not BNHS's. What counts as disengagement for a conservation NGO is a domain question I should have asked rather than assumed.</li></ol>",

/* ─────────────────────────── RAPID ─────────────────────────── */
rapid: [
 {q:"What is RAG, in one sentence?", a:"Retrieve relevant documents at query time and put them in the prompt, so the model answers from real content and can cite it."},
 {q:"RAG vs fine-tuning?", a:"Fine-tuning teaches style and format, not reliable facts — and can't cite sources. RAG updates instantly and every answer is traceable."},
 {q:"Why chunk documents?", a:"Retrieval granularity — you want the relevant passage, not 40 pages of which one paragraph matters."},
 {q:"Why join chunks back to the parent document?", a:"Retrieve at chunk granularity for precision, cite at document granularity for usefulness — title, author, link."},
 {q:"What is an embedding?", a:"A vector (768 dims here) representing meaning, trained so semantically similar texts land close together in that space."},
 {q:"What does <code>&lt;=&gt;</code> do in pgvector?", a:"Cosine distance. <code>1 - distance</code> gives similarity; ordering by it is nearest-neighbour search."},
 {q:"Why did semantic search get removed?", a:"PyTorch blew the serverless bundle limit; the Hugging Face API then failed with DNS issues from AWS Mumbai. Moved to Postgres full-text search."},
 {q:"What was lost in that migration?", a:"Semantic matching — synonyms and paraphrases no longer match. A real downgrade, traded for deployability and zero per-query cost."},
 {q:"How does <code>to_tsvector</code> work?", a:"Normalises text into stemmed lexemes, dropping stop words, so “conservation/conserving/conserved” collapse to one term. GIN-indexed."},
 {q:"What is hybrid search?", a:"Run keyword and vector search and fuse the rankings (e.g. Reciprocal Rank Fusion). Keyword wins on exact names, vector on concepts."},
 {q:"Why wrap retrieved text in <code>&lt;CONTEXT&gt;</code> tags?", a:"Prompt-injection defence — keep untrusted data structurally separate from your instructions."},
 {q:"What happens when retrieval finds nothing?", a:"Falls back to general knowledge and instructs the model to leave <code>source_reference</code> null — degrade gracefully, stay honest."},
 {q:"Why FastAPI/Python here?", a:"The hard parts are data problems: sentence-transformers, pypdf, XGBoost, SHAP. Plus async I/O, Pydantic validation and auto-generated OpenAPI docs."},
 {q:"Verify vs decode a JWT?", a:"Decoding tells you what the token claims; anyone can craft claims. Verifying checks it against the auth server — only that is trustworthy."},
 {q:"401 vs 403?", a:"401 = I don't know who you are (re-authenticate). 403 = I know, and you may not do this (different permissions)."},
 {q:"Why default to the least-privileged role?", a:"A missing profile row must never escalate access. Fail to the safe side."},
 {q:"Why did a 500 look like a CORS error?", a:"Starlette's error middleware sits outside CORSMiddleware, so an unhandled exception returns without CORS headers and the browser blames CORS."},
 {q:"How do you confirm a phantom CORS error?", a:"Hit the endpoint with curl — it doesn't implement CORS, so you see the real 500 and traceback."},
 {q:"Why is wildcard CORS with credentials dangerous?", a:"Any site could make authenticated requests with a logged-in user's credentials. Browsers explicitly forbid that combination."},
 {q:"Why is <code>award_coins</code> a Postgres function?", a:"Atomicity — ledger insert and balance update must both commit or neither, and the client can't span a transaction across two requests."},
 {q:"Why ledger + balance rather than balance alone?", a:"Double-entry thinking: the ledger is truth and auditable; the balance is a cached aggregate that can be recomputed from it."},
 {q:"What is a lost update?", a:"Two concurrent read-modify-writes both read 100 and both write 110, so one update vanishes. Fix: increment in SQL, atomically."},
 {q:"Why lazy streak evaluation, not a cron job?", a:"No scheduler, no nightly scan of every user, no timezone edge cases, no silent failure — and inactive users cost nothing."},
 {q:"Why is the daily topic picked by calendar day?", a:"Determinism — regenerating for the same date gives the same topic, which makes it reproducible and debuggable."},
 {q:"Why is <code>generate_fn</code> a parameter?", a:"A dependency-injection seam — tests pass a fake, so the suite runs with no Groq key and no network."},
 {q:"Why XGBoost over a neural network?", a:"Small tabular data is where boosted trees dominate. A neural net would overfit immediately and be harder to explain."},
 {q:"What does SHAP give you?", a:"Per-prediction feature attributions — a <b>local</b> explanation of why <em>this</em> user was flagged, not global importance."},
 {q:"Why is accuracy the wrong metric here?", a:"Class imbalance — predicting “not churned” for everyone could score 85% and catch nobody. Use precision and recall."},
 {q:"The one-line JeevSetu pitch?", a:"A digital hub for BNHS that organises decades of scattered conservation content into RAG-powered search with cited sources, community engagement and gamification pointing at real BNHS actions."}
],

<script>
(function(){
"use strict";

var KEY = "nb:" + (NOTEBOOK.slug || "notebook") + ":v1";
var S = load();

function load(){
  try{ var r = localStorage.getItem(KEY); if(r) return JSON.parse(r); }catch(e){}
  return {done:{}, mcq:{}, chk:{}, theme:null};
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

/* ---------- theme ---------- */
function applyTheme(){
  if(S.theme) document.documentElement.setAttribute("data-theme", S.theme);
  else document.documentElement.removeAttribute("data-theme");
}
applyTheme();
document.getElementById("theme").onclick = function(){
  S.theme = (S.theme === "light") ? "dark" : "light";
  applyTheme(); save();
};
document.getElementById("reset").onclick = function(){
  if(!confirm("Clear all your answers, scores and progress for this notebook?")) return;
  S = {done:{}, mcq:{}, chk:{}, theme:S.theme}; save(); render(page);
};

/* ---------- helpers ---------- */
function el(tag, cls, html){
  var n = document.createElement(tag);
  if(cls) n.className = cls;
  if(html != null) n.innerHTML = html;
  return n;
}
function esc(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function hiCode(s){
  return esc(s)
    .replace(/(^|\n)(\s*(?:\/\/|#)[^\n]*)/g, "$1<span class='c'>$2</span>")
    .replace(/«([^»]*)»/g, "<mark>$1</mark>");
}

/* ---------- pages ---------- */
var PAGES = [];
NOTEBOOK.phases.forEach(function(p,i){ PAGES.push({kind:"phase", data:p, idx:i}); });
PAGES.push({kind:"interview"});
PAGES.push({kind:"rapid"});

var page = 0;
try{
  var h = parseInt(location.hash.replace("#p",""),10);
  if(!isNaN(h) && h>=0 && h<PAGES.length) page = h;
}catch(e){}

function pageId(i){
  var pg = PAGES[i];
  if(pg.kind === "phase") return "ph:" + pg.data.id;
  return pg.kind;
}
function pageTitle(i){
  var pg = PAGES[i];
  if(pg.kind === "phase") return pg.data.title;
  if(pg.kind === "interview") return "Interview room";
  return "Rapid fire";
}

/* ---------- progress ---------- */
function updateProgress(){
  var total = PAGES.length, n = 0;
  for(var i=0;i<total;i++) if(S.done[pageId(i)]) n++;
  var pct = Math.round(n/total*100);
  document.getElementById("pfill").style.width = pct + "%";
  document.getElementById("ppct").textContent = pct + "%";
}

/* ---------- TOC ---------- */
function buildToc(){
  var toc = document.getElementById("toc");
  toc.innerHTML = "";
  toc.appendChild(el("div","toc-h","Learn"));
  PAGES.forEach(function(pg,i){
    if(pg.kind === "interview") toc.appendChild(el("div","toc-h","Interview prep"));
    var a = el("a", (i===page?"on ":"") + (S.done[pageId(i)]?"done":""),
      "<span class='n'>" + (pg.kind==="phase" ? (i+1) : (pg.kind==="interview"?"★":"⚡")) + "</span>" +
      "<span>" + esc(pageTitle(i)) + "</span><span class='tick'>✓</span>");
    a.href = "#p" + i;
    a.onclick = function(e){ e.preventDefault(); go(i); };
    toc.appendChild(a);
  });
}

function go(i){
  page = i;
  history.replaceState(null,"","#p"+i);
  render(i);
  window.scrollTo({top:0, behavior:"instant"});
}

/* ---------- block renderers ---------- */
function renderBlock(b, ns){
  switch(b.type){
    case "h":        return el("h3","sec", esc(b.text));
    case "h4":       return el("h4","sub", esc(b.text));
    case "p":        return el("p","p", b.html);
    case "dim":      return el("p","p dim", b.html);
    case "ul":       return el("ul","l", b.items.map(function(x){return "<li>"+x+"</li>";}).join(""));
    case "ol":       return el("ol","l", b.items.map(function(x){return "<li>"+x+"</li>";}).join(""));
    case "rule":     return el("hr","rule");
    case "call":     return callout(b);
    case "code":     return code(b);
    case "dia":      return diagram(b);
    case "cmp":      return compare(b);
    case "stats":    return statGrid(b);
    case "status":   return statusGrid(b);
    case "check":    return check(b, ns);
    case "mcq":      return mcq(b, ns, false);
    default:         return el("div","", "");
  }
}

var ICONS = {why:"◆", trap:"▲", tip:"●", warn:"▲", story:"❝"};
function callout(b){
  var v = b.variant || "why";
  var n = el("div","call " + v);
  n.appendChild(el("div","ct", "<span>"+(ICONS[v]||"◆")+"</span><span>"+esc(b.title||"")+"</span>"));
  n.insertAdjacentHTML("beforeend", b.html);
  return n;
}
function code(b){
  var n = el("div","codeblk");
  n.appendChild(el("div","cf", "<b>" + esc(b.file||"") + "</b>" + (b.note ? "<span>— "+esc(b.note)+"</span>" : "")));
  n.appendChild(el("pre","", hiCode(b.code)));
  return n;
}
function diagram(b){
  var n = el("div","dia");
  n.appendChild(el("pre","", esc(b.art)));
  if(b.cap) n.appendChild(el("div","cap", b.cap));
  return n;
}
function compare(b){
  var n = el("div","cmp");
  if(b.title) n.appendChild(el("div","ch", esc(b.title)));
  b.rows.forEach(function(r){
    var row = el("div","row");
    var v = r.verdict === "chosen" ? "chosen" : (r.verdict === "maybe" ? "maybe" : "no");
    var vl = r.verdict === "chosen" ? "Chosen" : (r.verdict === "maybe" ? "Partly" : "Rejected");
    row.appendChild(el("div","opt","<b>"+esc(r.option)+"</b><span class='verd "+v+"'>"+vl+"</span>"));
    row.appendChild(el("div","why", r.why));
    n.appendChild(row);
  });
  return n;
}
function statGrid(b){
  var n = el("div","stats");
  b.items.forEach(function(s){ n.appendChild(el("div","stat","<div class='v'>"+esc(s.v)+"</div><div class='k'>"+esc(s.k)+"</div>")); });
  return n;
}
function statusGrid(b){
  var n = el("div","status-grid");
  b.items.forEach(function(s){
    n.appendChild(el("div","st","<span class='b "+s.state+"'>"+esc(s.state)+"</span><div class='d'><b>"+esc(s.what)+"</b>"+s.detail+"</div>"));
  });
  return n;
}

/* ---------- quick check ---------- */
function check(b, ns){
  var id = ns + ":" + hash(b.q);
  var n = el("div","chk");
  n.appendChild(el("div","ct","<span>✎</span><span>Quick check — answer before you read on</span>"));
  n.appendChild(el("div","q", b.q));
  var ta = el("textarea");
  ta.placeholder = "Type your answer out loud-style, in one or two sentences…";
  ta.value = (S.chk[id] && S.chk[id].text) || "";
  ta.oninput = function(){ S.chk[id] = S.chk[id] || {}; S.chk[id].text = ta.value; save(); };
  n.appendChild(ta);
  var showBtn = el("button","btn pri","Show model answer");
  n.appendChild(showBtn);
  var ans = el("div","ans", "<b>Model answer.</b> " + b.a);
  n.appendChild(ans);
  var grade = el("div","grade");
  var ok = el("button","btn ok","✓ I had that");
  var no = el("button","btn no","✗ I missed it");
  grade.appendChild(ok); grade.appendChild(no);
  n.appendChild(grade);

  function paint(){
    var st = S.chk[id] || {};
    ok.classList.toggle("sel", st.g === 1);
    no.classList.toggle("sel", st.g === 0);
  }
  showBtn.onclick = function(){ n.classList.add("open"); showBtn.classList.add("hidden"); };
  ok.onclick = function(){ S.chk[id] = S.chk[id]||{}; S.chk[id].g = 1; save(); paint(); };
  no.onclick = function(){ S.chk[id] = S.chk[id]||{}; S.chk[id].g = 0; save(); paint(); };
  if(S.chk[id] && S.chk[id].g != null){ n.classList.add("open"); showBtn.classList.add("hidden"); }
  paint();
  return n;
}

/* ---------- mcq ---------- */
function hash(s){
  var h = 0, i;
  for(i=0;i<s.length;i++){ h = ((h<<5)-h) + s.charCodeAt(i); h |= 0; }
  return Math.abs(h).toString(36);
}
function mcq(b, ns, inQuiz, onAnswer){
  var id = ns + ":" + hash(b.q);
  var n = el("div","mcq");
  if(!inQuiz) n.appendChild(el("div","ct","<span>◈</span><span>Check yourself</span>"));
  n.appendChild(el("div","q", b.q));
  var opts = el("div","opts");
  var btns = [];
  b.options.forEach(function(o,i){
    var t = el("button","o","<span class='ltr'>"+"ABCDEF"[i]+"</span><span>"+o+"</span>");
    t.onclick = function(){ pick(i); };
    btns.push(t); opts.appendChild(t);
  });
  n.appendChild(opts);
  n.appendChild(el("div","exp", "<b>" + (b.explainLead || "Why:") + "</b> " + b.explain));

  function paint(sel){
    n.classList.add("answered");
    btns.forEach(function(t,i){
      t.disabled = true;
      if(i === b.answer) t.classList.add("right");
      else if(i === sel) t.classList.add("wrong");
    });
  }
  function pick(i){
    if(n.classList.contains("answered")) return;
    S.mcq[id] = i; save(); paint(i);
    if(onAnswer) onAnswer(i === b.answer);
  }
  if(S.mcq[id] != null) paint(S.mcq[id]);
  return n;
}

/* ---------- phase page ---------- */
function renderPhase(pg, host){
  var p = pg.data, ns = "ph:" + p.id;
  host.appendChild(el("div","kicker", "Phase " + (pg.idx+1) + " of " + NOTEBOOK.phases.length + (p.kicker ? " · " + esc(p.kicker) : "")));
  host.appendChild(el("h1","phase-title", esc(p.title)));
  if(p.tagline) host.appendChild(el("p","phase-tag", p.tagline));
  p.blocks.forEach(function(b){ host.appendChild(renderBlock(b, ns)); });

  if(p.quiz && p.quiz.length){
    var cp = el("div","cp");
    cp.appendChild(el("h3","","<span>🎯</span><span>Checkpoint — Phase " + (pg.idx+1) + "</span>"));
    cp.appendChild(el("div","sb", (p.quizNote || "Answer all " + p.quiz.length + " to unlock the next phase. No peeking back up.")));
    var right = 0, done = 0;
    var scoreBox = el("div","score");
    p.quiz.forEach(function(q){
      cp.appendChild(mcq(q, ns + ":cp", true, function(ok){
        done++; if(ok) right++;
        if(done === p.quiz.length) finish(right);
      }));
    });
    cp.appendChild(scoreBox);
    function finish(r){
      var msg = r === p.quiz.length ? "Clean sweep. You can explain this phase cold." :
                r >= Math.ceil(p.quiz.length*0.6) ? "Solid. Re-read the ones you missed — they're the ones an interviewer will push on." :
                "Worth another pass. Scroll back through this phase before moving on.";
      scoreBox.innerHTML = "<b>" + r + " / " + p.quiz.length + "</b> — " + msg;
      scoreBox.classList.add("show");
      S.done[ns] = true; save(); buildToc(); updateProgress();
    }
    // restore
    var pre = 0, all = true;
    p.quiz.forEach(function(q){
      var id = ns + ":cp:" + hash(q.q);
      if(S.mcq[id] == null) all = false;
      else if(S.mcq[id] === q.answer) pre++;
    });
    if(all) { right = pre; done = p.quiz.length; finish(pre); }
    host.appendChild(cp);
  } else {
    var mark = el("button","btn pri","Mark this phase done ✓");
    mark.style.marginTop = "28px";
    mark.onclick = function(){ S.done[ns] = true; save(); buildToc(); updateProgress(); mark.textContent = "Done ✓"; mark.disabled = true; };
    if(S.done[ns]){ mark.textContent = "Done ✓"; mark.disabled = true; }
    host.appendChild(mark);
  }
}

/* ---------- interview page ---------- */
function renderInterview(host){
  var iv = NOTEBOOK.interview;
  host.appendChild(el("div","kicker","Interview prep · high-yield only"));
  host.appendChild(el("h1","phase-title", iv.title || "The interview room"));
  host.appendChild(el("p","phase-tag", iv.intro || ""));

  if(iv.pitch){
    var c = el("div","call story");
    c.appendChild(el("div","ct","<span>❝</span><span>Your 60-second pitch — memorise the shape, not the words</span>"));
    c.insertAdjacentHTML("beforeend", iv.pitch);
    host.appendChild(c);
  }
  (iv.pre || []).forEach(function(b){ host.appendChild(renderBlock(b, "iv")); });

  var groups = {};
  iv.questions.forEach(function(q){
    var g = q.group || "General";
    (groups[g] = groups[g] || []).push(q);
  });
  Object.keys(groups).forEach(function(g){
    host.appendChild(el("h3","sec", esc(g)));
    groups[g].forEach(function(q,i){
      host.appendChild(bubble(q, i+1));
    });
  });

  if(iv.closing){
    var cc = el("div","call tip");
    cc.appendChild(el("div","ct","<span>●</span><span>" + esc(iv.closing.title) + "</span>"));
    cc.insertAdjacentHTML("beforeend", iv.closing.html);
    host.appendChild(cc);
  }
  var mark = el("button","btn pri","Mark interview room done ✓");
  mark.style.marginTop = "28px";
  mark.onclick = function(){ S.done["interview"] = true; save(); buildToc(); updateProgress(); mark.textContent="Done ✓"; mark.disabled=true; };
  if(S.done["interview"]){ mark.textContent="Done ✓"; mark.disabled=true; }
  host.appendChild(mark);
}

function bubble(q, n){
  var b = el("div","qb");
  var tag = q.tag || "likely";
  var head = el("button","qh",
    "<span class='qmark'>Q</span>" +
    "<span class='qt'>" + esc(q.q) + "</span>" +
    "<span class='tag t-" + tag + "'>" + esc(tag) + "</span>" +
    "<span class='chev'>▶</span>");
  var body = el("div","qa");
  body.insertAdjacentHTML("beforeend", q.a);
  if(q.say){
    var s = el("div","say","<span class='lbl'>Say it like this</span>" + q.say);
    body.appendChild(s);
  }
  if(q.follow && q.follow.length){
    var f = el("div","follow","<span class='lbl'>They will follow up with</span><ul>" +
      q.follow.map(function(x){return "<li>"+x+"</li>";}).join("") + "</ul>");
    body.appendChild(f);
  }
  head.onclick = function(){ b.classList.toggle("open"); };
  b.appendChild(head); b.appendChild(body);
  return b;
}

/* ---------- rapid fire ---------- */
function renderRapid(host){
  var R = NOTEBOOK.rapid;
  host.appendChild(el("div","kicker","Last 20 minutes before the call"));
  host.appendChild(el("h1","phase-title","Rapid fire"));
  host.appendChild(el("p","phase-tag","One card at a time. Say the answer out loud, then flip. If you stumble, hit <b>Again</b> and it comes back at the end."));

  var queue = R.map(function(_,i){ return i; });
  var pos = 0, seen = 0, kept = 0;

  var bar = el("div","fc-bar");
  var counter = el("div","chip on","1 / " + R.length);
  var again = el("button","btn no","↺ Again");
  var next = el("button","btn pri","Got it →");
  bar.appendChild(counter); bar.appendChild(again); bar.appendChild(next);

  var card = el("div","fcard");
  function paint(){
    if(pos >= queue.length){
      card.className = "fcard";
      card.innerHTML = "<div class='fq'>Deck cleared.</div><div class='fa' style='display:block'>You went through " + seen + " cards and recalled " + kept + " first time. Go be brilliant.</div>";
      counter.textContent = "done";
      again.classList.add("hidden"); next.classList.add("hidden");
      return;
    }
    var r = R[queue[pos]];
    card.className = "fcard";
    card.innerHTML = "<div class='fq'>" + r.q + "</div><div class='fa'>" + r.a + "</div><div class='hint'>Tap to flip</div>";
    counter.textContent = (pos+1) + " / " + queue.length;
  }
  card.onclick = function(){ card.classList.toggle("flip"); };
  next.onclick = function(){ seen++; kept++; pos++; paint(); };
  again.onclick = function(){ seen++; queue.push(queue[pos]); pos++; paint(); };

  host.appendChild(bar);
  host.appendChild(card);
  paint();

  if(NOTEBOOK.finalNote){
    var c = el("div","call tip");
    c.appendChild(el("div","ct","<span>●</span><span>Before you close this tab</span>"));
    c.insertAdjacentHTML("beforeend", NOTEBOOK.finalNote);
    host.appendChild(c);
  }
  var mark = el("button","btn pri","Mark rapid fire done ✓");
  mark.style.marginTop = "28px";
  mark.onclick = function(){ S.done["rapid"] = true; save(); buildToc(); updateProgress(); mark.textContent="Done ✓"; mark.disabled=true; };
  if(S.done["rapid"]){ mark.textContent="Done ✓"; mark.disabled=true; }
  host.appendChild(mark);
}

/* ---------- render ---------- */
function render(i){
  var host = document.getElementById("main");
  host.innerHTML = "";
  var pg = PAGES[i];
  if(pg.kind === "phase") renderPhase(pg, host);
  else if(pg.kind === "interview") renderInterview(host);
  else renderRapid(host);

  var nav = el("div","pagenav");
  if(i > 0){
    var prev = el("button","btn","<small>Previous</small>" + esc(pageTitle(i-1)));
    prev.onclick = function(){ go(i-1); };
    nav.appendChild(prev);
  } else nav.appendChild(el("div","",""));
  if(i < PAGES.length-1){
    var nx = el("button","btn","<small>Next up</small>" + esc(pageTitle(i+1)));
    nx.onclick = function(){ go(i+1); };
    nav.appendChild(nx);
  }
  host.appendChild(nav);
  buildToc(); updateProgress();
}

document.title = NOTEBOOK.docTitle || document.title;
render(page);
})();
</script>
</body>
</html>
